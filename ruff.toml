# Python lint for scripts/, paper/ and tests/ (run in CI). Notebooks are Colab exports and are not linted.
target-version = "py311"
line-length = 120
extend-exclude = ["notebooks"]

[lint]
select = ["E4", "E7", "E9", "F"]
# The research scripts use compact one-line statements and small lambdas on purpose.
ignore = ["E701", "E702", "E731"]
