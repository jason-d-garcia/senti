# Looks up album covers ahead of time (scripts/fetch_covers.ts) and commits them. Resumable: run it again
# to continue where the last run stopped.
name: Fetch covers
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to run (minutes)
        default: "330"
permissions:
  contents: write
concurrency: covers
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types scripts/fetch_covers.ts --minutes "${{ inputs.minutes }}"
      - name: Commit covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/covers
          git diff --cached --quiet && exit 0
          git commit -m "Covers: pre-fetched album art"
          git pull --rebase origin main
          git push origin HEAD:main
